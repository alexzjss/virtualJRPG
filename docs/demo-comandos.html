<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo dos comandos de ação</title>
<style>body{margin:0;background:#120c1c;color:#fde8e8;font:16px/1.4 system-ui,sans-serif;padding:20px 16px}h1{font-size:22px}h2{font-size:15px;margin:22px 0 8px;color:#ffb84a}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}button.d{padding:14px;border-radius:10px;border:1px solid #4a3a66;background:#241a36;color:#fff;text-align:left;cursor:pointer;font:inherit}button.d small{display:block;opacity:.7;margin-top:4px}
#out{margin-top:16px;padding:10px;border-radius:8px;background:#1d1430;min-height:40px;font-family:monospace;font-size:13px}</style>
<h1>Comandos de ação — demonstração jogável</h1><p>Cada botão abre o minigame real do jogo (o mesmo código). O resultado aparece embaixo.</p>
<h2>Defesa (o inimigo ataca)</h2><div class="g">
<button class="d" data-def="1">Golpe anunciado, 1 batida<small>Espaço no fim do anel = aparar; um pouco antes = esquivar</small></button>
<button class="d" data-def="3">Golpe de 3 batidas<small>um aperto por batida; aparar todas = contra-ataque</small></button>
<button class="d" data-def="choque">Choque de poderes<small>tecla C e martele Espaço</small></button></div>
<h2>Ataque (minigames)</h2><div class="g" id="atk"></div><div id="out">Escolha uma demonstração.</div>
<script>
const gm=false,name='ana',esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const out=t=>document.getElementById('out').textContent=t;let render=()=>{};
const hero={id:'h',name:'Shinkai',owner:'ana',hp:50,skills:['aparar','choq'],cm:{}},foe={id:'e',name:'Oni',enemy:true};
const S={chars:{h:hero,e:foe},skills:{aparar:{name:'Aparar',par:250,cost:4,power:3},choq:{name:'Onda contra Onda',cmd:'choque'}},battle:{active:true,ticks:{h:1,e:1}}};
function send(m){const C=S.battle.cmd;if(m.t==='def'){const i=C.p.h.length,left=C.at+C.beats[i]-Date.now(),g=RULES.CMD.gradeDef(left,250,450,true);C.p.h[i]=g;out('Aperto na batida '+(i+1)+': '+({par:'APAROU',esq:'ESQUIVOU',cedo:'cedo demais'}[g]||g));render()}
 else if(m.t==='chq'){if(m.skill&&!C.chq)C.chq={id:'h',at:Date.now(),w:3000,meta:20,n:0};else if(C.chq)C.chq.n+=m.n||0;render()}}
// Regras compartilhadas entre o servidor e o navegador: nomes de condições, votos, Despertares, afinidade de Aura,
// requisitos para aprender um nó e a descrição mecânica gerada a partir dos efeitos. Script comum (sem import/export):
// no navegador vira window.RULES; no servidor é importado só pelo efeito e lido em globalThis.RULES.
(g => {
  const DOT = ['burn', 'bleed', 'poison', 'rad'];
  const CTRL = ['stun', 'sleep', 'para', 'frozen', 'possess', 'confuse'];

    shield: 'Escudo', wet: 'Molhado', oil: 'Oleado', broken: 'Quebrado', regen: 'Regeneração', taunt: 'Provocando', guarded: 'Protegido', counter: 'Contra-ataque', reflect: 'Reflexo', evade: 'Esquiva', stealth: 'Furtivo', focus: 'Foco', exposed: 'Exposto', exaus: 'Exausto', seal: 'Selo', blind: 'Cego', root: 'Enraizado', charge: 'Concentrando', form: 'Transformado', endure: 'Tenacidade', dread: 'Pavor', mark: 'Marca' };
  // o que cada condição nova faz (as antigas já são conhecidas na mesa)
  const STD = { shield: 'absorve dano antes do HP', regen: 'recupera HP no início do turno', taunt: 'inimigos só conseguem mirar nele', guarded: 'um guarda-costas recebe os golpes no lugar', counter: 'revida golpes corpo a corpo com um ataque', reflect: 'devolve 30% do dano recebido',
    wet: 'conduz raio e vento (reações elementais)', oil: 'queima e explode com fogo e raio', broken: 'perdeu o turno, sofre +50% de dano e não age até se recompor',

    blind: '−25% de acerto', root: 'a Agilidade não ajuda a esquivar', charge: 'concentrando um golpe; dano forte ou controle interrompe', form: 'transformação ativa', endure: 'o próximo golpe fatal deixa com 1 HP', dread: 'perde Sanidade no início do turno e sofre +25% de dano mental', mark: 'Marca do Caçador desperta: +30% de dano, +20% de velocidade e +10% de crítico' };
  // cargas que se acumulam no próprio personagem durante a batalha (efeitos stack/burst): nome e bônus de dano por carga
  const STK = { doenca: ['Doença', 8], carga: ['Carga Elétrica', 6], brasa: ['Brasa', 6], mare: ['Maré', 6], rocha: ['Rocha', 6], vento: ['Vento', 6], luz: ['Luz', 6], sombra: ['Sombra', 6], sangue: ['Sangue', 6], mutacao: ['Mutação', 6], ressonancia: ['Ressonância', 6], impeto: ['Ímpeto', 6], pavor: ['Pavor', 6] };
  // reações: disparam sozinhas no turno do inimigo (1 por rodada, pagando o custo da técnica)
  const REA = { evade: 'esquiva', block: 'bloqueia', absorb: 'absorve', counter: 'revida' };
  const reaText = s => { const r = s.rea; return `reação automática (1×/rodada, paga o custo): ${r.t === 'evade' ? `${r.v}% de esquivar do golpe` : r.t === 'block' ? `bloqueia ${r.v}% do dano` : r.t === 'absorb' ? `absorve ${r.v}% do dano como Aura` : `revida com poder ${r.v}`}`; };
  const NEG = ['wet', 'oil', ...DOT, ...CTRL, 'curse', 'marked', 'down', 'silence', 'atkDn', 'defDn', 'agiDn', 'fear', 'fury', 'blind', 'root', 'exposed', 'exaus', 'dread', 'seal'];
  const POS = ['atkUp', 'defUp', 'agiUp', 'regen', 'counter', 'reflect', 'evade', 'stealth', 'focus', 'endure', 'taunt', 'mark'];
  // Aflições (Sanidade zerada e teste de SAB falho) e Virtudes (crítico): valem até o descanso longo
  const AFL = {
    paranoia: ['Paranoia', 'Desconfia de todos: −10% de acerto e −10% de defesa.', { hit: -10, def: -10 }],
    egoismo: ['Egoísmo', 'Só pensa em si: +10% de dano, mas as suas curas valem metade.', { atk: 10, heal: -50 }],
    desespero: ['Desespero', 'Perde as forças: −15% de dano e −10% de velocidade.', { atk: -15, agi: -10 }],
    masoquismo: ['Masoquismo', 'Procura a dor: +15% de dano e −20% de defesa.', { atk: 15, def: -20 }],
    abulia: ['Abulia', 'Nada importa: −10% de acerto e −20% de velocidade.', { hit: -10, agi: -20 }],

  const VIR = {
    vigor: ['Vigor', 'O corpo responde: +20% de dano.', { atk: 20 }],
    foco: ['Foco', 'A mente clareia: +15% de acerto e +10% de crítico.', { hit: 15, crit: 10 }],
    resolucao: ['Resolução', 'Nada derruba: +20% de defesa.', { def: 20 }],
    inspiracao: ['Inspiração', 'Uma ideia que acende o grupo: +15% de velocidade e +20% de cura.', { agi: 15, heal: 20 }],
    bravura: ['Bravura', 'Coragem de sobra: +10% de dano e de defesa.', { atk: 10, def: 10 }],
  };
  // laços entre personagens: pontos → nível 0-5
  const BOND = [0, 2, 4, 7, 10, 14], bondLv = p => BOND.filter(v => p >= v).length - 1;
  // clima da batalha: a cena define o inicial e algumas skills trocam; reforça ou enfraquece elementos e mexe no acerto
  const CLIMA = {
    sol: ['Sol Forte', { kagutsuchi: 1.2, amaterasu: 1.2, susanoo: .85, tsukuyomi: .85 }],
    chuva: ['Chuva', { susanoo: 1.2, indra: 1.15, kagutsuchi: .8 }],
    neblina: ['Névoa', { tsukuyomi: 1.2, hit: -10 }],
    tempestade: ['Tempestade', { indra: 1.25, fuhaku: 1.15, hit: -5 }],
    eclipse: ['Eclipse', { tsukuyomi: 1.25, shukketsu: 1.15, amaterasu: .8 }],
  };
  // reações elementais: um golpe do elemento em alvo com a condição consome a condição, multiplica o dano e pode aplicar outra
  const REACT = [
    { n: 'Eletrocutar', el: ['indra'], on: ['wet'], m: 1.3, a: ['para', 2], d: 'raio em Molhado: ×1,3 e Paralisia' },
    { n: 'Explosão', el: ['kagutsuchi'], on: ['oil'], m: 1.5, a: ['burn', 3], d: 'fogo em Oleado: ×1,5 e Queimadura' },
    { n: 'Vapor', el: ['kagutsuchi'], on: ['wet'], m: .9, a: ['blind', 2], d: 'fogo em Molhado: Cego' },
    { n: 'Faíscas', el: ['indra'], on: ['oil'], m: 1.2, a: ['burn', 2], d: 'raio em Oleado: ×1,2 e Queimadura' },
    { n: 'Estilhaçar', el: ['atlas', 'fis'], on: ['frozen'], m: 1.6, d: 'impacto em Congelado: ×1,6' },
    { n: 'Vento Gélido', el: ['fuhaku'], on: ['wet'], m: 1.1, a: ['frozen', 1], d: 'vento em Molhado: Congelado' },
    { n: 'Lama', el: ['atlas'], on: ['wet'], m: 1, a: ['root', 2], d: 'terra em Molhado: Enraizado' },
    { n: 'Purgar', el: ['amaterasu'], on: ['poison', 'rad'], m: 1.4, d: 'luz em Veneno ou Radiação: ×1,4 e remove' },
  ];
  const RESN = { hp: 'HP', aura: 'Aura', san: 'Sanidade', limit: 'Limite' };
  // votos e restrições (Seiyaku): nó passivo sempre ativo, com bônus e o preço cobrado pelo motor
  const VOW = {
    presa: ['Voto da Presa', 'O primeiro inimigo que você ferir na batalha vira a presa: +50% de dano nela, −25% nos outros.'],
    corpo: ['Voto do Corpo Fechado', '+30% de dano. Curar a si mesmo (skill ou item) rompe o voto até o fim da batalha e custa 20% da Sanidade máxima.'],
    pureza: ['Voto da Pureza', 'Skills do seu Vínculo causam +30%; ataque básico e skills marciais causam −40%.'],
    sangue: ['Voto de Sangue', '+40% de dano, mas toda skill custa também 8% do HP máximo.'],
    chama: ['Voto da Última Chama', '+60% de dano com HP até 40%; −15% acima disso.'],
    silencio: ['Voto do Silêncio', 'Não pode usar skills em área; skills de alvo único causam +35%.'],
    cacador: ['Voto do Caçador de Demônios', '+40% de dano contra demônios e chefes; −50% contra humanos.'],
    arma: ['Voto da Arma Única', 'Ataque básico e técnicas de arma causam +35%; outras skills ativas ficam proibidas.'],
    tempo: ['Voto do Tempo Contado', '+25% de dano e +15% de acerto, mas perde 4% do HP máximo no início de cada turno.'],
    preco: ['Voto do Preço', 'Rituais não gastam Aura; cada ritual custa +4 de Sanidade.'],
  };
  // Despertares: selos narrativos que só o mestre concede na ficha
  const AW = { outro: 'Tocado pelo Outro Lado', esp: 'Aura Singular', eremita: 'Comunhão Eremita', kagutsuchi: 'Despertar de Kagutsuchi', susanoo: 'Despertar de Susanoo', atlas: 'Despertar de Atlas', indra: 'Despertar de Indra', fuhaku: 'Despertar de Fuhaku', amaterasu: 'Despertar de Amaterasu', tsukuyomi: 'Despertar de Tsukuyomi', shukketsu: 'Despertar de Shukketsu', hiruko: 'Despertar de Hiruko' };
  // estados do personagem exigidos por alguns nós
  const CS = {
    duplo: ['ter dois Vínculos', ch => (ch.vinc || []).length >= 2],
    livre: ['não ter Vínculo', ch => !(ch.vinc || []).length],
    voto: ['ter um voto', (ch, sk) => ch.skills.some(k => sk[k]?.vow)],
    marcado: ['ter perdido 10+ de Sanidade máxima para o Outro Lado', ch => (ch.bon?.sanMax || 0) <= -10],
    laco: ['ter um laço de nível 3 ou mais com alguém', ch => (ch.bondMax || 0) >= 3],
    forma: ['conhecer uma transformação', (ch, sk) => ch.skills.some(k => sk[k]?.kind === 'form')],
  };
  // hexágono das categorias de Aura: vizinhas a 80%, a duas casas 60%, opostas 40% (e mais caras)
  const NEN = ['int', 'tra', 'con', 'esp', 'man', 'emi'], NENN = { int: 'Intensificação', tra: 'Transformação', con: 'Conjuração', esp: 'Especialização', man: 'Manipulação', emi: 'Emissão' };
  const nenD = (a, b) => { const d = Math.abs(NEN.indexOf(a) - NEN.indexOf(b)); return Math.min(d, 6 - d); };
  const nenEff = (ch, s) => !s.cat || !ch.nen ? 1 : [1, .8, .6, .4][nenD(ch.nen, s.cat)];
  const xpCost = (ch, s) => !s.cat || !ch.nen ? s.xp : Math.ceil(s.xp * [1, 1.25, 1.5, 2][nenD(ch.nen, s.cat)] / 5) * 5;
  const near = (a, b) => Math.max(Math.abs(a.gx - b.gx), Math.abs(a.gy - b.gy)) <= 1;
  // ligados: um está no ln do outro; skill solta (sem posição na mandala: criada, movida ou importada pelo mestre) também liga pela vizinhança de grade
  const loose = s => !Number.isFinite(s.wx);
  const linked = (a, b, ida, idb) => !!(a && b) && (!!a.ln?.includes(idb) || !!b.ln?.includes(ida) || ((loose(a) || loose(b)) && near(a, b)));
  const att = (ch, a, items) => ch.attrs[a] + (items && ch.equip?.acess && items[ch.equip.acess]?.attr === a ? items[ch.equip.acess].power : 0);
  // motivo pelo qual o personagem não pode aprender o nó agora ('' = pode). Inimigos não têm restrição.
  function whyNot(ch, s, sk, items, id, soft) { // soft: ignora XP e atributo mínimo (para pintar a grade)
    if (ch.enemy) return '';
    const own = ch.skills.map(k => sk[k]).filter(Boolean), byName = n => own.some(o => o.name === n), PN = g.RULES.PATRON;
    if (ch.skills.includes(id)) return 'Já aprendida.';
    if (!['fis', 'aura', 'oculto'].includes(s.el) && !(ch.vinc || []).includes(s.el)) return `Exige Vínculo com ${PN[s.el] || s.el}.`;
    if (s.el === 'oculto' && !(ch.aw || []).includes('outro')) return `Exige o Despertar "${AW.outro}" (dado pelo mestre).`;
    if (s.aw && !(ch.aw || []).includes(s.aw)) return `Exige o Despertar "${AW[s.aw] || s.aw}" (dado pelo mestre).`;
    if (s.cat === 'esp' && !(ch.aw || []).includes('esp') && ch.nen !== 'esp') return `Especialização exige o Despertar "${AW.esp}".`;
    if (s.v2 && !(ch.vinc || []).includes(s.v2)) return `Exige também o Vínculo com ${PN[s.v2] || s.v2}.`;
    if (s.ex && own.some(o => o.ex === s.ex && o !== s)) return 'Trancada: você escolheu o outro caminho.';
    if (own.length && !s.open && !ch.skills.some(k => linked(sk[k], s, k, id))) return 'Precisa de um nó vizinho já aprendido.';
    const pre = (s.pre || '').split('|').filter(Boolean).filter(n => !byName(n));
    if (pre.length) return `Precisa aprender antes: ${pre.join(', ')}.`;
    if (s.nb && own.filter(o => o.br === s.br).length < s.nb) return `Precisa de ${s.nb} nós deste ramo (tem ${own.filter(o => o.br === s.br).length}).`;
    if (s.cs && CS[s.cs] && !CS[s.cs][1](ch, sk)) return `Exige ${CS[s.cs][0]}.`;
    if (soft) return '';
    const rq = s.rq ? Object.entries(s.rq).filter(([a, v]) => att(ch, a, items) < v) : [];
    if (rq.length) return rq.map(([a, v]) => `Requer ${a} ${v} (você tem ${att(ch, a, items)}).`).join(' ');
    if (ch.xp < xpCost(ch, s)) return `Faltam ${xpCost(ch, s) - ch.xp} XP.`;
    return '';
  }
  // ----- notação compacta dos efeitos (a mesma de tree.js e arvore/*.js; também usada nas armas) -----
  // fx: 'st burn 3 60%; drain hp 30; shield 12 self' → lista de efeitos. Alvo opcional: self | ally | foes | tgt (padrão: o alvo da skill).
  // fm: 'dur 3; atk 25; def 10; agi 20; hit 10; crit 5; atkP 6; heal 20; dr aura 3; end st exaus 2' → transformação.
  const FXTO = new Set(['self', 'ally', 'foes', 'tgt']);
  const FXARGS = { st: ['k', 'n'], det: ['k', 'm'], drain: ['r', 'p'], res: ['r', 'p'], gain: ['r', 'p'], lose: ['r', 'p'], exec: ['p', 'm'], vs: ['k', 'm'], per: ['k', 'p'], rage: ['m'], pierce: ['p'], chain: ['n', 'm'], stack: ['k', 'n'], burst: ['k', 'm'],
    push: ['v'], haste: ['v'], seal: ['p', 'n'], shield: ['p'], revive: ['p'], spread: ['k'], guard: ['n'], clima: ['k', 'n'], brk: ['n'], scar: ['r', 'p'], clone: ['n', 'p'], sure: [], strip: [], steal: [], cleanse: [], turn: [] };
  const FXDEF = { stack: { n: 5 }, burst: { m: .25 }, st: { n: 3 }, det: { m: 6 }, pierce: { p: 100 }, chain: { m: .6 }, seal: { n: 3 }, guard: { n: 3 }, clone: { n: 1, p: 20 } };
  const FXTXT = new Set(['k', 'r']);
  function parseFx(str, where = '') {
    if (!str) return undefined;
    return String(str).split(';').map(x => x.trim()).filter(Boolean).map(item => {
      const w = item.split(/\s+/), t = w.shift(), keys = FXARGS[t];
      if (!keys) throw new Error(`efeito desconhecido "${item}" em ${where}`);
      const o = { t, ...FXDEF[t] }, pos = w.filter(x => !FXTO.has(x) && !x.endsWith('%'));
      keys.forEach((k, i) => { if (pos[i] == null) return; o[k] = FXTXT.has(k) ? pos[i] : +pos[i]; if (!FXTXT.has(k) && Number.isNaN(o[k])) throw new Error(`número inválido em "${item}" (${where})`); });
      if (keys.some(k => o[k] == null)) throw new Error(`faltam argumentos em "${item}" (${where})`);
      const ch = w.find(x => x.endsWith('%')), to = w.find(x => FXTO.has(x));
      if ((t === 'stack' || t === 'burst') && !STK[o.k]) throw new Error(`carga desconhecida "${o.k}" em ${where}`);
      if (t === 'st') { o.ch = ch ? parseInt(ch) : 100; if (!ST[o.k]) throw new Error(`condição desconhecida "${o.k}" em ${where}`); }
      if (to) o.to = to;
      return o;
    });
  }
  function parseForm(str, where = '') {
    const f = { dur: 3, m: {}, dr: {}, end: [] };
    for (const item of String(str).split(';').map(x => x.trim()).filter(Boolean)) {
      const [k, ...r] = item.split(/\s+/);
      if (k === 'end') f.end.push(...parseFx(r.join(' '), where));
      else if (k === 'dr') f.dr[r[0]] = +r[1];
      else if (k === 'dur') f.dur = +r[0];
      else if (k === 'ret') f.ret = +r[0];
      else if (['atk', 'def', 'agi', 'hit', 'crit', 'atkP', 'heal'].includes(k)) f.m[k] = +r[0];
      else throw new Error(`campo de forma desconhecido "${item}" em ${where}`);
    }
    return f;
  }
  // caminho inverso: efeitos lidos → texto na notação (o criador de armas copia técnicas da árvore assim)
  const fxSrc = l => (l || []).map(f => [f.t, ...FXARGS[f.t].map(k => f[k]), ...(f.t === 'st' && f.ch != null && f.ch < 100 ? [f.ch + '%'] : []), ...(f.to ? [f.to] : [])].join(' ')).join('; ');
  const formSrc = f => !f ? '' : [`dur ${f.dur}`, ...Object.entries(f.m || {}).map(([k, v]) => `${k} ${v}`), ...Object.entries(f.dr || {}).map(([k, v]) => `dr ${k} ${v}`), ...(f.ret ? [`ret ${f.ret}`] : []), ...(f.end || []).map(e => 'end ' + fxSrc([e]))].join('; ');
  // ----- descrição mecânica gerada dos campos da skill -----
  const TO = { self: 'em si', ally: 'nos aliados', foes: 'nos inimigos', tgt: '' };
  const pct = v => (v > 0 ? '+' : '') + v + '%';
  function fxOne(f) {
    const to = f.to && f.to !== 'tgt' ? ' ' + TO[f.to] : '';
    switch (f.t) {
      case 'st': return `${f.ch < 100 ? f.ch + '% de ' : ''}${ST[f.k] || f.k} ${f.n}t${to}`;
      case 'det': return `detona ${f.k === 'dot' ? 'todo dano contínuo' : f.k === 'neg' ? 'as condições ruins' : ST[f.k] || f.k} do alvo (+${f.m} por turno restante)`;
      case 'drain': return `rouba ${f.p}% do dano como ${RESN[f.r]}`;
      case 'exec': return `×${f.m} se o alvo tiver até ${f.p}% de HP`;
      case 'vs': return f.k === 'demon' ? `×${f.m} contra demônios` : `×${f.m} se o alvo tiver ${f.k === 'neg' ? 'condição ruim' : ST[f.k] || f.k}`;

      case 'stack': return f.k === 'doenca' ? `acumula 1 estágio da Doença em você (máx. ${f.n}): +8% de dano por estágio e, do 3º em diante, o corpo definha a cada turno` : `acumula 1 ${STK[f.k][0]} em você (máx. ${f.n}): +${STK[f.k][1]}% de dano por carga nas técnicas que a usam`;
      case 'burst': return `consome todas as cargas de ${STK[f.k][0]}: ×(1 + ${f.m} por carga)`;

.cmdo small{opacity:.8;max-width:290px}.cmdo button{font:700 14px/1 Barlow,sans-serif;letter-spacing:2px;padding:10px 18px;border-radius:8px;border:0;background:#3a2f4d;color:#fff;cursor:pointer;min-height:40px}`;
  document.head.append(css);
  const ARROW = { ArrowUp: '↑', KeyW: '↑', ArrowRight: '→', KeyD: '→', ArrowDown: '↓', KeyS: '↓', ArrowLeft: '←', KeyA: '←' };
  const inset = (ms, dur, size) => Math.round(size / 2 * (1 - (.38 + .62 * Math.min(1, ms / dur)))); // faixa de acerto num anel que fecha em `dur` ms

  let busy = false;

  window.runCmd = (key, hero, tgt, done) => {
    const s = S.skills[key]; if (busy || !s?.cmd) return false;
    busy = true;
    const mods = hero?.cm?.[key] || {}, C = RULES.CMD;
    let over = false, rafId = 0, timers = [];
    const el = document.createElement('div'); el.className = 'cmdo'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Comando de ataque');

    $('.t').textContent = s.name;
    const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); return t; };
    const cleanup = () => { removeEventListener('keydown', onKey, true); removeEventListener('keyup', onKeyUp, true); cancelAnimationFrame(rafId); timers.forEach(clearTimeout); busy = false; };
    const finish = (g = '', n = 0, acc = 0) => { // devolve a nota uma vez, mostra o resultado um instante e fecha
      if (over) return; over = true; cleanup(); done({ g, n, acc });
      const r = $('.cmdo-res'); r.className = 'cmdo-res ' + g; r.textContent = g === 'perf' ? 'PERFEITO!' : g === 'bom' ? 'BOM!' : acc < 0 ? 'ESTOUROU!' : '';
      setTimeout(() => el.remove(), g ? 650 : 150);
    };
    const T0 = performance.now(), loops = []; const loop = () => { if (over) return; const now = performance.now(); loops.forEach(f => f(now)); rafId = requestAnimationFrame(loop); };
    let onPress = () => {}, onRelease = () => {}, onArrow = () => {};

      body.innerHTML = `<div class="cmdo-stage"><div class="cmdo-ring"><u style="inset:${inset(cw, dur, 240)}px"></u><u class="p" style="inset:${inset(cp, dur, 240)}px"></u><i></i><b></b></div></div>`;
      const ring = body.querySelector('i'); loops.push(now => { ring.style.transform = `scale(${1 - .62 * Math.min(1, (now - T0) / dur)})`; });
      onPress = now => { const d = Math.abs(now - hit); finish(d <= cp ? 'perf' : d <= cw ? 'bom' : '', 0, Math.max(0, 1 - d / dur)); };
      later(() => finish(), dur + cw + 250);

      body.innerHTML = `<div class="cmdo-bar"><i></i></div>`; const bar = body.querySelector('i');
      onPress = () => { taps++; bar.style.width = Math.min(100, taps / mt * 100) + '%'; if (taps >= mt) end(); };
      const end = () => { const f = Math.min(1, taps / mt), n = Math.round(f * mx); finish(f >= 1 ? 'perf' : n > 0 ? 'bom' : '', n, f); };
      later(end, dur);
    } else if (k === 'segurar') { // segure e solte na faixa; passar do topo estoura
      const dur = 1600, z = ((s.cz || 8) + (mods.cz || 0)) / 100; let t1 = 0; hint('Segure Espaço (ou o toque) e solte na faixa verde. Passou do topo, estoura!');
      body.innerHTML = `<div class="cmdo-bar"><em class="g" style="left:60%;width:${(1 - z - .6) * 100}%"></em><em style="left:${(1 - z) * 100}%;width:${z * 100}%"></em><i></i></div>`; const bar = body.querySelector('i');
      onPress = now => { if (!t1) t1 = now; }; body.addEventListener('pointerleave', () => onRelease(performance.now()));
      onRelease = now => { if (!t1) return; const v = (now - t1) / dur; finish(v >= 1 - z ? 'perf' : v >= .6 ? 'bom' : '', 0, v); };
      loops.push(now => { if (!t1) return; const v = (now - t1) / dur; bar.style.width = Math.min(100, v * 100) + '%'; if (v > 1.02) finish('', 0, -1); });
    } else if (k === 'seq') { // setas na batida
      const seq = [...s.seq], gap = 500, lead = 700, tol = 120 + (mods.rit || 0), at = i => T0 + lead + i * gap, st = seq.map(() => ''); hint('Aperte as setas (ou WASD) no ritmo: cada uma acende na sua batida.');
      body.innerHTML = `<div class="cmdo-keys">${seq.map(a => `<span>${a}</span>`).join('')}</div>`; const spans = [...body.querySelectorAll('span')];
      onArrow = (a, now) => { const i = seq.findIndex((x, j) => !st[j] && Math.abs(now - at(j)) <= tol); if (i >= 0 && seq[i] === a) { st[i] = 'ok'; spans[i].className = 'ok'; } };
      loops.push(now => seq.forEach((_, i) => { if (st[i]) return; if (now > at(i) + tol) { st[i] = 'miss'; spans[i].className = 'miss'; } else if (now >= at(i) - tol) spans[i].className = 'now'; }));
      later(() => { const n = st.filter(x => x === 'ok').length; finish(n === seq.length ? 'perf' : n > 0 ? 'bom' : '', n, n / seq.length); }, lead + (seq.length - 1) * gap + tol + 150);
    } else if (k === 'ritmo') { // notas descendo numa pista
      const nt = s.nt || 6, gap = 560, lead = 1000, tol = 150 + (mods.rit || 0), at = i => T0 + lead + i * gap, st = Array(nt).fill(''); hint('Aperte Espaço (ou toque) quando cada nota passar pela linha.');
      body.innerHTML = `<div class="cmdo-lane"><div class="line"></div>${Array.from({ length: nt }, () => '<i></i>').join('')}</div>`; const notes = [...body.querySelectorAll('i')], H = 240, line = H - 30;
      onPress = now => { const i = st.findIndex((x, j) => !x && Math.abs(now - at(j)) <= tol); if (i >= 0) { st[i] = 'ok'; notes[i].className = 'ok'; } };
      loops.push(now => notes.forEach((nEl, i) => { const y = line - (at(i) - now) / 1000 * 160; nEl.style.top = y + 'px'; if (!st[i] && now > at(i) + tol) { st[i] = 'miss'; nEl.className = 'miss'; } }));
      later(() => { const n = st.filter(x => x === 'ok').length; finish(n === nt ? 'perf' : n > 0 ? 'bom' : '', n, n / nt); }, lead + (nt - 1) * gap + tol + 150);
    } else if (k === 'mira') { // mira oscilando: clique no ponto fraco
      const W = 220, Hh = 260, r = ((s.ma || 18) + (mods.ma || 0)) / 100 * W / 2, dur = 2500; hint('Clique (ou Espaço) quando a mira passar sobre o ponto fraco.');
      const pos = PART_POS[tgt?.weakPart]; let sx = (hashN(tgt?.id || 'x') % 60 + 20) / 100, sy = (hashN((tgt?.id || 'x') + 'y') % 60 + 20) / 100; if (pos) { sx = pos[0]; sy = pos[1]; }
      body.innerHTML = `<div class="cmdo-aim"><div class="sil" ${tgt?.img ? `style="background-image:url('${esc(tgt.img)}')"` : ''}></div><div class="pt" style="left:${sx * W}px;top:${sy * Hh}px;width:${r * 2}px;height:${r * 2}px"></div><div class="xh"></div></div>`;
      const xh = body.querySelector('.xh'); let cx = 0, cy = 0; loops.push(now => { const t = (now - T0) / 1000; cx = W / 2 + Math.sin(t * 2.6) * W * .46; cy = Hh / 2 + Math.sin(t * 3.7 + 1) * Hh * .44; xh.style.left = cx + 'px'; xh.style.top = cy + 'px'; });
      const shoot = () => { const d = Math.hypot(cx - sx * W, cy - sy * Hh); finish(d <= r * .4 ? 'perf' : d <= r ? 'bom' : '', 0, Math.max(0, 1 - d / W)); };
      onPress = shoot; body.querySelector('.cmdo-aim').addEventListener('pointerdown', e => { e.preventDefault(); shoot(); }); later(() => finish(), dur + 300);
    } else if (k === 'runa') { // desenhar o símbolo com o mouse ou o dedo
      const rune = s.rn || ['circulo', 'triangulo', 'estrela', 'espiral'][Math.max(0, Math.min(3, (s.circ || 1) - 1))], NAMES = { circulo: 'um círculo', triangulo: 'um triângulo', estrela: 'uma estrela', espiral: 'uma espiral', raio: 'um raio', onda: 'uma onda' };
      hint(`Desenhe ${NAMES[rune]} (4 s). Solte para conjurar.`); body.innerHTML = `<canvas width="480" height="480"></canvas>`;
      const cv = body.querySelector('canvas'), g = cv.getContext('2d'), pts = []; let down = false;
      g.strokeStyle = 'rgba(255,241,201,.22)'; g.lineWidth = 10; g.lineCap = 'round'; g.beginPath(); C.RUNE_T[rune].pts.forEach(([x, y], i) => { const X = 60 + x * 360, Y = 60 + y * 360; i ? g.lineTo(X, Y) : g.moveTo(X, Y); }); g.stroke();

      cv.addEventListener('pointerdown', e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); down = true; const p = at(e); pts.push(p); g.strokeStyle = '#ffb84a'; g.lineWidth = 8; g.beginPath(); g.moveTo(...p); });

    } else { busy = false; return false; }
    document.body.append(el); rafId = requestAnimationFrame(loop);

  };
  function hashN(str) { let h = 0; for (const c of String(str)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); }
}

// ===== Comandos de defesa: quando um inimigo vai agir e a janela (S.battle.cmd) inclui um herói deste jogador, aparece um anel que fecha. =====
// Uma tecla só (botão, Espaço ou toque): no fim exato do anel APARA (custa Aura, exige o nó de Aparar); um pouco antes ESQUIVA (de graça, só em golpe anunciado);
// cedo demais pune. Golpes de várias batidas ganham um anel por batida. Se o herói tem uma técnica de Choque, o botão CHOQUE (C) troca o anel por um cabo de guerra.
{
  const css = document.createElement('style');
  css.textContent = `.apr{position:fixed;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;pointer-events:none}
.apr-box{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 22px;border-radius:14px;background:rgba(12,8,20,.82);border:1px solid #b42b2b;box-shadow:0 0 40px rgba(180,40,40,.45);color:#fde8e8;font:600 15px/1.3 Barlow,sans-serif;max-width:calc(100vw - 32px);text-align:center}
.apr-box.perf{border-color:#ffd24a;box-shadow:0 0 50px rgba(255,210,74,.6)}
.apr-ring{position:relative;width:150px;height:150px}
.apr-ring i{position:absolute;inset:0;border-radius:50%;border:4px solid #ff5a5a;transform-origin:center}
.apr-ring b{position:absolute;inset:58px;border-radius:50%;background:#ffd2d2;box-shadow:0 0 16px #ff5a5a}
.apr-ring u{position:absolute;border-radius:50%;border:2px dashed #ffd2d2;opacity:.8}
.apr-ring u.esq{border-color:#8fd3ff}
.apr-chips{display:flex;gap:6px;justify-content:center;min-height:22px}
.apr-chips span{padding:2px 8px;border-radius:999px;background:#2a2036;font:700 12px/1.5 Barlow,sans-serif;letter-spacing:1px}
.apr-chips span.par{background:#d63b3b}.apr-chips span.esq{background:#2d7fb8}.apr-chips span.cedo,.apr-chips span.late{background:#6b5a2a}
.apr-tug{width:240px;height:18px;border-radius:9px;background:#2a2036;overflow:hidden;position:relative}
.apr-tug i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ffb84a,#ff5a5a);width:0}
.apr-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.apr button{font:700 18px/1 Barlow,sans-serif;letter-spacing:3px;padding:12px 28px;border-radius:10px;border:0;background:#d63b3b;color:#fff;cursor:pointer;min-height:44px}
.apr button.chq{background:#e0a020;color:#1a1020}
.apr button:disabled{opacity:.5;cursor:default}
.apr small{opacity:.85;max-width:300px}`;
  document.head.append(css);
  let el = null, key = '', t0 = 0, raf = 0, hid = '', pend = 0, tugT = 0;
  const D = () => RULES.CMD.DEF;
  const heroes = () => { const C = S?.battle?.cmd; if (gm || !S?.battle?.active || !C) return []; return Object.values(S.chars).filter(c => !c.enemy && c.owner === name && c.hp > 0 && C.tgs?.includes(c.id)); };
  const chqKey = h => (h.skills || []).find(k => S.skills[k]?.cmd === 'choque') || '';
  const kill = () => { if (el) { el.remove(); el = null; } cancelAnimationFrame(raf); clearInterval(tugT); pend = 0; };
  const impact = (C, i) => t0 + C.beats[i] - 150; // o anel fecha um pouco antes do impacto no servidor (ida e volta da rede)
  const press = () => {
    const C = S?.battle?.cmd; if (!el || !C) return;
    if (C.chq?.id === hid) { pend++; return; }
    send({ t: 'def', id: hid });
  };
  const startChq = () => { const C = S?.battle?.cmd, h = S.chars[hid]; if (!el || !C || !h || C.chq) return; send({ t: 'chq', id: hid, skill: chqKey(h) }); };
  addEventListener('keydown', e => {
    if (!el) return;
    if (e.code === 'Space') { e.preventDefault(); press(); }
    else if (e.code === 'KeyC') { const C = S?.battle?.cmd; if (C?.chq?.id === hid) pend++; else startChq(); }
  });
  const frame = () => {
    const C = S?.battle?.cmd; if (!el || !C) return;
    const now = performance.now(), ring = el.querySelector('.apr-ring i'); let i = C.beats.findIndex((_, k) => now <= impact(C, k)); if (i < 0) i = C.beats.length - 1;
    const st = i === 0 ? t0 : impact(C, i - 1), dur = impact(C, i) - st, f = Math.min(1, Math.max(0, (now - st) / dur));
    ring.style.transform = `scale(${1 - .61 * f})`; el.querySelectorAll('.apr-ring u').forEach(u => { u.style.inset = inset(+u.dataset.ms, dur) + 'px'; }); // a faixa de Aparar/Esquiva acompanha a duração do anel da vez
    const bar = el.querySelector('.apr-tug i'); if (bar && C.chq) { const ch = C.chq, p = Math.min(1, (ch.n + pend) / ch.meta); bar.style.width = (p * 100) + '%'; }
    if (now > impact(C, C.beats.length - 1) + 900 + (C.chq ? 3000 : 0)) { kill(); return; }
    raf = requestAnimationFrame(frame);
  };
  const inset = (ms, dur) => Math.round((150 - (58.5 + 91.5 * Math.min(1, ms / dur))) / 2);
  const paint = () => { // o que muda a cada estado: notas, botões e o cabo de guerra
    const C = S.battle.cmd, h = S.chars[hid], z = C.z?.[hid] || {}, notes = C.p?.[hid] || [], foe = S.chars[C.foe];
    const chips = C.beats.map((_, i) => { const v = notes[i]; return `<span class="${v || ''}">${v === 'par' ? 'APAROU' : v === 'esq' ? 'ESQUIVOU' : v === 'cedo' ? 'CEDO' : '•'}</span>`; }).join('');
    const mine = C.chq?.id === hid, tug = mine ? `<div class="apr-tug" aria-label="Choque de poderes"><i></i></div><small>Martele Espaço ou C! Meta: ${C.chq.meta} apertos</small>` : '';
    const canChq = C.chqOk?.includes(hid) && !C.chq && chqKey(h);
    el.querySelector('.apr-title').textContent = `${foe?.name || 'O inimigo'} vai atacar!${C.perf ? ' PERFEITO!' : ''}`;
    el.querySelector('.apr-box').classList.toggle('perf', !!C.perf);

    el.querySelector('.apr-row').innerHTML = (mine ? '' : `<button type="button" class="def">${C.tel ? (z.canP ? 'ESQUIVAR / APARAR' : 'ESQUIVAR') : 'APARAR'}</button>`) + (canChq ? `<button type="button" class="chq">CHOQUE (C)</button>` : '');
    el.querySelector('.apr-hint').textContent = mine ? '' : C.tel ? `${h.name}${z.canP ? ` · Espaço no fim do anel apara (${z.cost || 0} Aura); um pouco antes esquiva` : ' · Espaço um pouco antes do fim do anel esquiva'}` : `${h.name} · ${z.cost || 0} Aura · aperte quando o anel fechar (Espaço)`;
    el.querySelector('.def')?.addEventListener('click', press); el.querySelector('.chq')?.addEventListener('click', startChq);
    if (mine && !tugT) tugT = setInterval(() => { if (pend) { send({ t: 'chq', id: hid, n: pend }); pend = 0; } }, 250);
  };
  const sync = () => {
    const C = S?.battle?.cmd, l = C ? heroes() : [], k = C ? C.foe + ':' + C.at : '';
    if ((!l.length || k !== key) && el) kill();
    if (!l.length) return;
    if (!el) {
      key = k; t0 = performance.now(); hid = l[0].id; const h = l[0], z = C.z?.[hid] || {}, parMs = z.par || 0, esqMs = z.esq || 0;
      el = document.createElement('div'); el.className = 'apr'; el.setAttribute('role', 'alertdialog'); el.setAttribute('aria-label', 'Defender do golpe');
      const zones = (parMs ? `<u class="par" data-ms="${parMs}"></u>` : '') + (esqMs ? `<u class="esq" data-ms="${parMs + esqMs}"></u>` : '');
      el.innerHTML = `<div class="apr-box"><div class="apr-title"></div><div class="apr-ring">${zones}<i></i><b></b></div><div class="apr-chips"></div><div class="apr-mid"></div><div class="apr-row"></div><small class="apr-hint"></small></div>`;
      document.body.append(el); raf = requestAnimationFrame(frame);
    }
    paint();
  };
  const render3 = render; render = function () { render3(); try { sync(); } catch (e) { console.error(e); } };
}

const A=[['tempo','Golpe no tempo',{cmd:'tempo',bf:5}],['martelar','Martelar',{cmd:'martelar',mx:4}],['segurar','Segurar e soltar',{cmd:'segurar'}],['seq','Sequência',{cmd:'seq',seq:'↑→↓←'}],['ritmo','Ritmo',{cmd:'ritmo',nt:6}],['mira','Mira',{cmd:'mira',ma:20}],['runa','Runa (círculo)',{cmd:'runa',rn:'circulo'}]];
const box=document.getElementById('atk');
for(const [k,n,d] of A){S.skills[k]={name:n,kind:'dmg',power:10,...d};const b=document.createElement('button');b.className='d';b.innerHTML=n+'<small>clique para jogar</small>';b.onclick=()=>runCmd(k,hero,foe,r=>out(n+' → nota: '+JSON.stringify(r)));box.append(b)}
function win(beats,x){S.battle.cmd={foe:'e',at:Date.now(),w:beats[beats.length-1],beats,tel:true,tgs:['h'],p:{h:[]},z:{h:{par:250,esq:450,cost:4,canP:true}},...x};render()}
document.querySelectorAll('[data-def]').forEach(b=>b.onclick=()=>{const v=b.dataset.def,bs=v==='3'?[1100,1800,2500]:[1100];win(bs,v==='choque'?{chqOk:['h']}:{});setTimeout(()=>{S.battle.cmd=null;render()},bs[bs.length-1]+(v==='choque'?3600:900))});
