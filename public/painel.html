<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel ao vivo · virtualJRPG</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@500;700&family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
:root{--ink:#09090b;--ink2:#131316;--ink4:#28282f;--line:#34343d;--paper:#f4efe4;--dim:#a8a5b2;--red:#e4002b;--gold:#ffc93c;--bad:#ff5468}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--paper);font:500 14px/1.4 Barlow,"Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
small{color:var(--dim)}
button,input{font:inherit}
button{font:600 13px "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.6px;text-transform:uppercase;color:var(--paper);background:var(--ink4);border:0;border-bottom:2px solid #0006;padding:6px 12px;min-height:30px;cursor:pointer}
button:hover{background:#34343d}
button.on{background:var(--red)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.grow{flex:1}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tools[hidden]{display:none}
h1{margin:0;font:400 18px Anton,Impact,sans-serif;letter-spacing:1px;text-transform:uppercase;background:var(--red);padding:4px 22px 4px 12px;clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%)}

/* acesso (fica salvo no navegador, a mesma chave que as telas usam) */
#setup{display:none;padding:24px;max-width:460px;margin:auto;flex-direction:column;gap:10px}
#setup.show{display:flex}
#setup h2{margin:0;font:400 20px Anton,Impact,sans-serif;letter-spacing:1px;text-transform:uppercase}
#setup label{display:flex;flex-direction:column;gap:4px;color:var(--dim);font:600 12px "Barlow Condensed",sans-serif;letter-spacing:.6px;text-transform:uppercase}
#setup input{background:var(--ink2);color:var(--paper);border:1px solid var(--line);padding:8px 10px;font:500 15px Barlow,sans-serif}
#err{color:var(--bad);min-height:1.2em}

/* quadros */
#grid{display:none;flex:1;min-height:0;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:8px;padding:8px}
#grid.show{display:grid}
#grid.solo{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;border:1px solid var(--line);background:var(--ink2)}
.pane.gm{grid-row:1 / span 2}
#grid.solo .pane{grid-row:auto}
.pane.hide{display:none}
.phead{display:flex;align-items:center;gap:8px;padding:4px 8px;border-bottom:1px solid var(--line);background:var(--ink)}
.phead b{font:600 13px "Barlow Condensed",sans-serif;letter-spacing:1px;text-transform:uppercase}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block}
.dot.live{background:#3ddc84;box-shadow:0 0 6px #3ddc84}
.pane iframe{flex:1;width:100%;min-height:0;border:0;background:var(--ink)}
.pane .phead button{min-height:24px;padding:2px 8px}

@media (max-width:820px){ /* celular ou janela estreita: quadros empilhados, a página rola */
  body{overflow:auto}
  #grid{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-auto-rows:minmax(75vh,auto)}
  .pane.gm{grid-row:auto}
  #grid.solo{grid-auto-rows:minmax(calc(100vh - 110px),auto)}
}
</style>
<body>
<div class="bar">
  <h1>Painel ao vivo</h1>
  <small>Cada quadro é a tela real. O que muda em um aparece nos outros na hora.</small>
  <span class="grow"></span>
  <div id="tools" class="tools" hidden>
    <button data-focus="all" class="on">Tudo</button>
    <button data-focus="gm">Mestre</button>
    <button data-focus="player">Jogador</button>
    <button data-focus="table">Mesa</button>
    <button id="reset">Trocar acesso</button>
  </div>
</div>

<form id="setup" autocomplete="off">
  <h2>Entrar nas três telas</h2>
  <small>Os dados ficam salvos neste navegador. Use a mesma chave e o mesmo nome e senha de jogador das telas separadas.</small>
  <label>Chave do mestre<input id="k" type="password" required></label>
  <label>Nome do jogador (sem espaços)<input id="n" required maxlength="30"></label>
  <label>Senha do jogador<input id="p" type="password" required minlength="3"></label>
  <div id="err"></div>
  <button type="submit" class="on">Abrir painel</button>
</form>

<div id="grid">
  <section class="pane gm" data-p="gm">
    <div class="phead"><span class="dot" data-dot="gm"></span><b>Mestre</b><small>/gm</small><span class="grow"></span><button data-focus="gm" title="Mostrar só esta tela">⤢</button></div>
    <iframe title="Tela do mestre" data-f="gm"></iframe>
  </section>
  <section class="pane" data-p="player">
    <div class="phead"><span class="dot" data-dot="player"></span><b>Jogador</b><small>/player</small><span class="grow"></span><button data-focus="player" title="Mostrar só esta tela">⤢</button></div>
    <iframe title="Tela do jogador" data-f="player"></iframe>
  </section>
  <section class="pane" data-p="table">
    <div class="phead"><span class="dot" data-dot="table"></span><b>Mesa · geral</b><small>/table</small><span class="grow"></span><button data-focus="table" title="Mostrar só esta tela">⤢</button></div>
    <iframe title="Tela geral da mesa" data-f="table"></iframe>
  </section>
</div>

<script src="/painel.js"></script>
</body></html>
